# Phase 2 end-to-end fixture: a node that proposes new nodes.
#
# `docs/design/workflow-builder/06-phase2-plan.md` WS-J, over
# `04-kvdag-and-execution.md` §3.4. Every node is `runner = "command"`, per the
# Phase 1 rule: the nodes here are plain processes, so expansion is exercised
# against the real engine path with no network, no API cost, and no `claude`.
#
# **One fixture, three scenarios.** The proposing node's argv carries three
# placeholders the harness substitutes per run, so accepted expansion, truncated
# expansion, and a refused template are the same graph told what to ask for:
#
#   @STUB@      -> tests/fixtures/workflow/node_stub.sh
#   @FANOUT@    -> tests/fixtures/workflow/expand_stub.sh
#   @WORKER@    -> tests/fixtures/workflow/expand_worker_stub.sh
#   @MODE@      -> `batch` (one proposal for @COUNT@ children, one label) or
#                  `shards` (@COUNT@ proposals of one child each, each with its
#                  own `--label` and `--input goal=…`)
#   @TEMPLATE@  -> the kvdag key the proposal names
#   @COUNT@     -> the proposal's `--count`
#
# **The shape.** `fanout` proposes children of the `worker` template; `collect`
# sits downstream of `fanout` on a data edge. §3.4's fan-in guarantee is that an
# accepted child inherits its parent's *outbound* edges, so every worker also
# gets an edge into `collect` and `collect` cannot start until the whole
# generation has settled. That inheritance is the thing under test, and it is
# why `collect` is drawn downstream of `fanout` rather than of `worker` — an
# edge out of a template would be dropped at materialisation, and
# `Kvdag::try_new` reports the node behind it as unreachable.
#
# `quarantined` is a real template that is deliberately *not* in `fanout`'s
# `expand_allow`, so the refusal scenario names a template that exists rather
# than a typo. Nothing instantiates it, and a template is never scheduled
# directly, so it costs the run nothing.
#
# Node dirs live under `KARVEX_WORKFLOW_RUNS_DIR`, so nothing is written next to
# this file.

name = "e2e-expand"
description = "a fan-out node proposes template children; a fan-in node waits for the whole generation"
contract = """
Reply only through result.json. Never edit files outside your node dir.
"""
# 3 generations of children are permitted; static nodes are depth 0, so a
# first-generation child is depth 1 (`06-phase2-plan.md` §4 D13).
max_depth = 3
# The version ceiling. A `--tier low` run narrows this to 12 and nothing widens
# it, which is what makes the truncation scenario a property of the tier rather
# than of the document.
max_nodes = 24

[[arg]]
name = "goal"
required = true
description = "what to fan out about"

[[node]]
key = "fanout"
label = "Fan out"
kind = "agent"
runner = "command"
command = ["/bin/sh", "@FANOUT@", "@MODE@", "@TEMPLATE@", "@COUNT@", '{"plan":"stub fan-out plan","summary":"the fan-out plan"}']
demand = "standard"
prompt_template = "Split this into shards: {{goal}}"
output_schema = { type = "object", required = ["plan"], properties = { plan = { type = "string" } } }
# Only `worker`. `quarantined` is a template too, and leaving it out of this
# list is exactly what the refusal scenario asserts.
expand_allow = ["worker"]
# Above the run's node budget on every tier this fixture is run at, so a
# truncation is attributed to `max_nodes` and not to this node's own ceiling —
# `expand::evaluate` breaks the tie toward the *node-level* limit, so the two
# must not be equal for the run-level one to be the reported cause.
expand_max = 16

[[node]]
key = "worker"
label = "Worker"
kind = "agent"
runner = "command"
is_template = true
# Every child of a template is spawned from this one authored argv, so a fixed
# payload would make N children indistinguishable — the exact failure the
# payload path has to make impossible. This stub reports what its *own* node
# directory says about it: the filled `{{goal}}` slot and its instance path.
command = ["/bin/sh", "@WORKER@"]
demand = "standard"
# A template has no static inbound edge, so every slot it names has to resolve
# to a declared arg. `Kvdag::try_new` proves that at authoring time, which is
# what lets an expand proposal's `inputs` be an override channel over one
# validated renderer rather than a second unvalidated one (§4 D3).
prompt_template = "Work one shard of: {{goal}}"
output_schema = { type = "object", required = ["report"], properties = { report = { type = "string" } } }

[[node]]
key = "quarantined"
label = "Quarantined"
kind = "agent"
runner = "command"
is_template = true
command = ["/bin/sh", "@STUB@", "report", '{"report":"this template must never be instantiated"}']
demand = "standard"
prompt_template = "Never instantiated: {{goal}}"
output_schema = { type = "object", required = ["report"], properties = { report = { type = "string" } } }

[[node]]
key = "collect"
label = "Collect"
kind = "agent"
runner = "command"
command = ["/bin/sh", "@STUB@", "report", '{"report":"stub collection report"}']
demand = "standard"
prompt_template = "Collect the shard reports:\n{{shard}}"
output_schema = { type = "object", required = ["report"], properties = { report = { type = "string" } } }

[[edge]]
from = "fanout"
to = "collect"
kind = "data"
payload = "summary"
port = "shard"
