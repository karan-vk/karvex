# Phase 1 end-to-end fixture for the completion authority of
# `docs/design/workflow-builder/04-kvdag-and-execution.md` §4.3.
#
# `runner = "command"` nodes have exactly one completion signal — their own
# self-report — so a node that cannot produce `result.json` has to be surfaced
# by that report. The stub here reports *without* writing the file: the server
# is what turns "no result artifact" into NeedsAttention. A client that
# validates the file itself and exits before contacting the server leaves this
# node Running forever with nothing to escalate.
#
# The stub-path placeholder in `command` is substituted by the test with the
# absolute path of `tests/fixtures/workflow/node_stub.sh`.

name = "e2e-missing-result"
description = "a node that reports with no result.json must reach NeedsAttention"
contract = """
Reply only through result.json.
"""
max_depth = 3
max_nodes = 24

[[arg]]
name = "goal"
required = true
description = "what to build"

[[node]]
key = "empty"
label = "Empty"
kind = "agent"
runner = "command"
command = ["/bin/sh", "@STUB@", "noresult"]
demand = "standard"
prompt_template = "Produce an implementation plan for: {{goal}}"
output_schema = { type = "object", required = ["plan"], properties = { plan = { type = "string" } } }
