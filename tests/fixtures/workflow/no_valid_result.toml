# Phase 1 end-to-end fixture for the design's single most important behavioural
# guarantee (`docs/design/workflow-builder/00-overview.md` D7,
# `04-kvdag-and-execution.md` §4.3): **a node that reaches turn end without a
# valid result never completes.** It goes to NeedsAttention, and
# `run_terminal_ready` (§3.2) refuses to report the run as succeeded.
#
# Two nodes so the guarantee is visible at run level as well as node level:
#
#   `stalled`  self-reports twice with a document that does not satisfy its
#              output schema. The first report earns exactly one corrective
#              re-prompt; the second sends the node to NeedsAttention.
#   `after`    is downstream of `stalled` on a data edge, so it must never
#              become Ready — a branch is not allowed to quietly evaporate.
#
# The stub-path placeholder in each `command` is substituted by the test with
# the absolute path of `tests/fixtures/workflow/node_stub.sh`.

name = "e2e-no-valid-result"
description = "a node that never produces a schema-valid result must not succeed"
contract = """
Reply only through result.json.
"""
max_depth = 3
max_nodes = 24

[[arg]]
name = "goal"
required = true
description = "what to build"

[[node]]
key = "stalled"
label = "Stalled"
kind = "agent"
runner = "command"
command = ["/bin/sh", "@STUB@", "report2", '{"unrelated":"no plan field here"}']
demand = "standard"
prompt_template = "Produce an implementation plan for: {{goal}}"
output_schema = { type = "object", required = ["plan"], properties = { plan = { type = "string" } } }

[[node]]
key = "after"
label = "After"
kind = "agent"
runner = "command"
command = ["/bin/sh", "@STUB@", "report", '{"report":"downstream should never run"}']
demand = "standard"
prompt_template = "Implement this plan:\n{{plan}}"
output_schema = { type = "object", required = ["report"], properties = { report = { type = "string" } } }

[[edge]]
from = "stalled"
to = "after"
kind = "data"
payload = "summary"
port = "plan"
