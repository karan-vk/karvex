# Phase 3 end-to-end fixture: restore a past run's checkpoint into a new run.
#
# `docs/design/workflow-builder/07-phase3-plan.md` §WS-J scenario 2. Two
# `runner = "command"` nodes joined by a data edge, so restoring the upstream
# one exercises exactly what §4 D3 promises: a seeded node is `Restored`,
# pane-less, and fires its outbound edges like a succeeded one, feeding the
# downstream node the *source run's* payload.
#
# `@PLAN_PROMPT@` is substituted by the test rather than hard-coded: the
# cross-version half of the scenario authors a v2 whose `plan` prompt differs,
# which is precisely what §4 D11's `sha256(prompt_template)` digest gate reads.
# The stub-path placeholder is substituted the same way `node_stub.sh`'s is.

name = "e2e-restore"
description = "stub plan -> stub implement, restorable across versions"
max_depth = 3
max_nodes = 24

[[arg]]
name = "goal"
required = true
description = "what to build"

[[node]]
key = "plan"
label = "Plan"
kind = "agent"
runner = "command"
command = ["/bin/sh", "@RESTORE_STUB@", "plan"]
demand = "standard"
prompt_template = "@PLAN_PROMPT@"
output_schema = { type = "object", required = ["plan"], properties = { plan = { type = "string" } } }

[[node]]
key = "implement"
label = "Implement"
kind = "agent"
runner = "command"
command = ["/bin/sh", "@RESTORE_STUB@", "report"]
demand = "standard"
prompt_template = "Implement this plan:\n{{plan}}"
output_schema = { type = "object", required = ["report"], properties = { report = { type = "string" } } }

[[edge]]
from = "plan"
to = "implement"
kind = "data"
payload = "summary"
port = "plan"
