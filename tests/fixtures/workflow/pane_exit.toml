# Phase 1 end-to-end fixture for `04-kvdag-and-execution.md` §4.3's
# "PaneExited before a valid result ⇒ Failed".
#
# The node's process exits straight away without writing `result.json`, so the
# only thing the engine ever learns about it is that its pane died. With
# `max_attempts = 1` there is no retry to wait through: the node must land in
# `failed`, the run must not report success, and — because a failed node still
# records a succession — the run must reach a terminal status rather than
# hanging `running` forever and blocking every later `workflow.run`.
#
# The stub-path placeholder in `command` is substituted by the test with the
# absolute path of `tests/fixtures/workflow/node_stub.sh`.

name = "e2e-pane-exit"
description = "a node whose pane exits before a valid result must fail the run"
contract = """
Reply only through result.json.
"""
max_depth = 3
max_nodes = 24

[[arg]]
name = "goal"
required = true
description = "what to build"

[[node]]
key = "doomed"
label = "Doomed"
kind = "agent"
runner = "command"
command = ["/bin/sh", "@STUB@", "die", "3"]
demand = "standard"
max_attempts = 1
prompt_template = "Work on: {{goal}}"
output_schema = { type = "object", required = ["report"], properties = { report = { type = "string" } } }
