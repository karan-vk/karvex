# The default `workflow` feature pulls surrealdb -> surrealdb-core ->
# jsonwebtoken -> aws-lc-rs -> aws-lc-sys. surrealdb-core hard-pins the
# `aws_lc_rs` jsonwebtoken backend for every non-wasm target, so this is not
# escapable through Cargo features while `workflow` is on.
#
# On x86_64 Windows, aws-lc-sys assembles its crypto with NASM and its build
# script panics with "NASM command not found! Build cannot continue." when nasm
# is missing. Not every Windows host or GitHub runner image ships it: the
# windows-2025 image does, the windows-2022 image used by the ConPTY package job
# does not.
#
# aws-lc-sys vendors prebuilt objects for exactly this case. Opting in is inert
# unless the target is x86_64 Windows AND nasm is genuinely absent (see
# `use_prebuilt_nasm()` in the crate's builder), so hosts that have nasm keep
# using the real assembler and every non-Windows target ignores this entirely.
[env]
AWS_LC_SYS_PREBUILT_NASM = "1"

# Use the wild linker for local Linux (glibc) builds — it links kvx faster
# than mold or lld. wild is Linux-only (x86-64 and ARM64), so macOS keeps its
# default (already fast) linker and Windows is untouched. `-fuse-ld=wild`
# needs GCC >= 16.1 or clang with an ld.wild shim on PATH. Release artifacts
# build against *-musl targets, which these sections do not match. CI runners
# ship an older GCC, so the host-target test jobs override these rustflags
# with CARGO_TARGET_*_RUSTFLAGS to use mold instead (env beats config).
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=wild"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=wild"]
